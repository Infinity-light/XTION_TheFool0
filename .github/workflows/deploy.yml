name: Deploy to VPS

on:
  push:
    branches:
      - hyw_20260316

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Build and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            mkdir -p /opt/apps
            cd /opt/apps

            # Clone or pull latest code
            if [ -d "xtion-thefool0/.git" ]; then
              cd xtion-thefool0
              git fetch origin hyw_20260316
              git reset --hard origin/hyw_20260316
            else
              rm -rf xtion-thefool0
              git clone -b hyw_20260316 https://github.com/Infinity-light/XTION_TheFool0.git xtion-thefool0
              cd xtion-thefool0
            fi

            # Generate .env
            cat > .env << 'ENVEOF'

            ENVEOF
            sed -i 's/^ *//' .env

            docker image prune -f
            docker compose up -d --build

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Waiting for container to start..."
            sleep 10
            for i in 1 2 3 4 5; do
              STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
              if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
                echo "Health check passed (HTTP $STATUS)"
                exit 0
              fi
              echo "Attempt $i: HTTP $STATUS, retrying in 5s..."
              sleep 5
            done
            echo "Health check failed after 5 attempts"
            docker logs xtion-thefool0 --tail 20
            exit 1
